name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Set up Node for frontend builds
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Configure isolated CI environment
        run: cp .env.example .env
      - name: Apply committed migrations
        run: bun run db:migrate
      - name: Lint and format check
        run: bun run lint
      - name: Typecheck all workspaces
        run: bun run typecheck
      - name: Run unit and PostgreSQL integration tests
        run: bun run test
      - name: Build API and both frontends
        run: bun run build
