# Deploy from repository root: fly deploy -c fly.web.toml
app = "starter-web"
primary_region = "iad"

[build]
  dockerfile = "apps/web/Dockerfile"

  [build.args]
    VITE_APP_ORIGIN = "https://app.example.com"
    VITE_WEB_ORIGIN = "https://example.com"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
